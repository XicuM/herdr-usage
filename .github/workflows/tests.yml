name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check mods/herdr-usage/main.js
      - run: node --check mods/herdr-usage/usage.js
      - run: sh -n mods/herdr-usage/helpers/claude-usage.sh
      - run: sh -n mods/herdr-usage/helpers/codex-limits.sh
